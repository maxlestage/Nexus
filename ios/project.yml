# Projet Xcode généré par XcodeGen (brew install xcodegen).
# Le .xcodeproj n'est pas versionné : il se régénère à partir de ce fichier.
name: NexusOne
options:
  bundleIdPrefix: com.maximelestage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  NexusOne:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maximelestage.nexusone
        INFOPLIST_KEY_CFBundleDisplayName: Nexus One
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          Nexus One utilise le Bluetooth pour se connecter à votre manette et
          en modifier la configuration.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # Pont Rust : bibliothèque statique + en-tête C.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NexusOne-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../ios-bridge/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/rust
        OTHER_LDFLAGS: -lnexus_bridge
    preBuildScripts:
      - name: Compiler le pont Rust
        script: "\"$SRCROOT/scripts/build-rust.sh\""
        basedOnDependencyAnalysis: false

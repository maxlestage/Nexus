# Projet Xcode généré par XcodeGen (brew install xcodegen).
# Le .xcodeproj n'est pas versionné : il se régénère à partir de ce fichier.
name: NexusOne
options:
  bundleIdPrefix: com.maximelestage
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  NexusOne:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_ID}
        # Sans cela, les clés INFOPLIST_KEY_* ci-dessous sont ignorées et la
        # signature échoue faute d'Info.plist.
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Nexus One
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Aucun chiffrement propre à l'application : sans cette clé, TestFlight
        # retient la version en attendant une réponse manuelle sur la
        # conformité à l'exportation.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          Nexus One utilise le Bluetooth pour se connecter à votre manette et
          en modifier la configuration.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone uniquement : l'application se tient d'une main, en portrait.
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: false
        # Pont Rust : bibliothèque statique + en-tête C.
        SWIFT_OBJC_BRIDGING_HEADER: Sources/NexusOne-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../app-core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/rust
        OTHER_LDFLAGS: -lnexus_app_core
    preBuildScripts:
      - name: Compiler le cœur Rust
        script: "\"$SRCROOT/scripts/build-rust.sh\""
        basedOnDependencyAnalysis: false

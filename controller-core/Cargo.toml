[package]
name = "controller-core"
version = "0.1.0"
edition = "2021"
description = "Logique partagée de la manette une main : mapping, turbo, macros, stats, protocole Pro Controller et protocole de configuration BLE"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
heapless = { version = "0.8", features = ["serde"] }

[features]
default = ["std"]
std = ["serde/std", "postcard/use-std"]

name: App iOS

on:
  push:
    branches: [master]
    paths: ["ios/**", "app-core/**", "controller-core/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "app-core/**", "controller-core/**"]
  workflow_dispatch:

# L'identifiant de l'application. Redéfinissable sans toucher au code par une
# variable de dépôt (Settings → Secrets and variables → Actions → Variables).
env:
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.maximelestage.nexusone' }}

jobs:
  # Le pont Rust se vérifie sans Mac : autant échouer vite et pour pas cher.
  bridge:
    name: Cœur Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: clippy
      - run: cargo test -p nexus-app-core -p controller-core
      - run: cargo clippy -p nexus-app-core --all-targets -- -D warnings
      - run: cargo check -p nexus-app-core --target aarch64-apple-ios

  build:
    name: Compilation iOS
    needs: bridge
    runs-on: macos-15
    # Le contexte « secrets » n'est pas exploitable dans un « if » : on le
    # transforme en variable d'environnement, elle utilisable.
    env:
      HAS_ASC_KEY: ${{ secrets.ASC_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Déposer la clé App Store Connect
        if: env.HAS_ASC_KEY == 'true'
        working-directory: ios
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p build
          printf '%s\n' "$ASC_KEY_P8" > build/asc_key.p8
          chmod 600 build/asc_key.p8

      # Le Team ID se déduit de la clé : pas de secret supplémentaire à créer.
      # Un secret APPLE_TEAM_ID, s'il existe, reste prioritaire.
      - name: Déterminer le Team ID
        if: env.HAS_ASC_KEY == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: build/asc_key.p8
          OVERRIDE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            TEAM="$OVERRIDE"
            echo "Team ID fourni par secret."
          else
            TEAM="$(ruby scripts/team-id.rb)"
          fi
          echo "DEVELOPMENT_TEAM=$TEAM" >> "$GITHUB_ENV"
          echo "Team ID retenu : $TEAM"

      - name: Générer le projet Xcode
        working-directory: ios
        run: |
          # Défini même sans clé (compilation non signée) : XcodeGen exige
          # que la variable existe.
          export DEVELOPMENT_TEAM="${DEVELOPMENT_TEAM:-}"
          xcodegen generate

      # Sans clé (pull request, fork, secrets absents), on s'arrête à une
      # compilation non signée : elle valide le Swift et le pont Rust sans
      # toucher au compte Apple.
      - name: Compiler sans signature
        if: github.event_name == 'pull_request' || env.HAS_ASC_KEY != 'true'
        working-directory: ios
        run: fastlane check

      - name: Compiler et envoyer sur TestFlight
        if: github.event_name != 'pull_request' && env.HAS_ASC_KEY == 'true'
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          CHANGELOG: ${{ github.event.head_commit.message }}
          # Nom de la fiche App Store Connect, si les noms par défaut sont pris.
          APP_NAME: ${{ vars.APP_NAME }}
        run: fastlane beta

      # Les réglages Info.plist ne se vérifient que sur le produit compilé.
      # Sans cette trace, une clé ignorée par Xcode ne se voit qu'une fois la
      # version arrivée — ou bloquée — dans TestFlight.
      - name: Relire l'Info.plist compilé
        if: always()
        run: |
          APP="$(find ~/Library/Developer/Xcode/Archives -name NexusOne.app -type d 2>/dev/null | head -1)"
          if [ -z "$APP" ]; then
            echo "Aucune archive : la compilation n'a pas abouti."
            exit 0
          fi
          plutil -p "$APP/Info.plist"

      - name: Effacer la clé
        if: always()
        working-directory: ios
        run: rm -f build/asc_key.p8

      - name: Conserver l'IPA
        if: hashFiles('ios/build/NexusOne.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: NexusOne-ipa
          path: ios/build/NexusOne.ipa

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: controller-core (tests + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test -p controller-core
      - run: cargo fmt -p controller-core --check
      - run: cargo clippy -p controller-core -- -D warnings
